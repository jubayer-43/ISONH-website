name: Update education news

on:
  schedule:
    - cron: "0 2,14 * * *"   # every day at 02:00 and 14:00 UTC (8:00 am and 8:00 pm in Bangladesh)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python scripts/fetch_news.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "isonh-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add news.json
            git commit -m "Update education news"
            git push
          else
            echo "No changes"
          fi
